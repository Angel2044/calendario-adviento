<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7a0f1c" />
  <meta name="description" content="Un calendario de adviento lleno de Navidad, regalos y amor." />
  <title>Calendario de Adviento 🎄</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="snow" aria-hidden="true"></div>

  <header class="hero">
    <div class="lights" aria-hidden="true"></div>
    <p class="hero__eyebrow">✨ Cuenta atrás hacia la Navidad ✨</p>
    <h1 class="hero__title">Calendario de Adviento</h1>
    <p class="hero__subtitle">Cada día de diciembre se abre un regalito lleno de amor ❤️</p>
    <div class="countdown" id="countdown"></div>
  </header>

  <main>
    <section class="grid" id="grid" aria-label="Días del calendario"></section>
  </main>

  <footer class="footer">
    <p>Hecho con ❤️, 🎅 y mucha magia navideña</p>
  </footer>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal__backdrop" data-close></div>
    <article class="modal__card">
      <button class="modal__close" type="button" aria-label="Cerrar" data-close>×</button>
      <div class="modal__day" id="modal-day"></div>
      <div class="modal__emoji" id="modal-emoji"></div>
      <h2 class="modal__title" id="modal-title"></h2>
      <p class="modal__text" id="modal-text"></p>
      <p class="modal__sign">Con todo mi amor 💌</p>
    </article>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="days.js"></script>
  <script src="script.js"></script>
</body>
</html>
